[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bionic-eye-controller"
version = "0.1.0"
description = "Desktop vision processing and a reference device simulator for bionic-eye software research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Marcelo Collado"}]
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<13", "cryptography>=44,<49"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.10,<5"]
hardware = ["pyserial>=3.5,<4", "pyusb>=1.2,<2"]
hands = ["mediapipe>=0.10.21,<0.11"]
voice = ["vosk>=0.3.45,<0.4", "sounddevice>=0.5,<0.6"]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
bionic-eye = "bionic_eye.cli:main"

[project.urls]
Repository = "https://github.com/xatusbetazx17/bionical_eye_controller"
Issues = "https://github.com/xatusbetazx17/bionical_eye_controller/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
